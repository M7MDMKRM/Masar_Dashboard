<svg width="140" height="60" viewBox="0 0 140 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Location Pin Icon -->
  <g id="logo-icon">
    <!-- Green left arch -->
    <path d="M 28 8 C 16 8 8 16 8 28 C 8 36 14 44 20 50 L 26 56 L 26 42 C 20 38 16 32 16 26 C 16 18 21 13 28 13 C 33 13 37 16 39 20 L 46 16 C 42 11 36 8 28 8 Z" fill="#1B6A58"/>
    <!-- Blue right arch and bottom point -->
    <path d="M 28 13 C 35 13 40 18 40 25 C 40 33 32 43 28 54 C 26 49 22 43 20 37 L 27 33 C 31 31 33 28 33 25 C 33 22 31 19 28 19 L 28 13 Z" fill="#3B82F6"/>
    <!-- Curving Road & Arrow through the pin -->
    <path d="M 14 46 C 22 38 24 30 35 23 L 42 18 L 38 18 L 46 16 L 44 24 L 41 20 C 31 27 28 34 18 44 Z" fill="#2563EB"/>
    <!-- Road dashed markings -->
    <path d="M 18 43 Q 23 37 28 30 Q 33 24 40 19" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- "masar" text in English -->
  <text x="50" y="32" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#3B82F6" letter-spacing="-0.5">masar</text>

  <!-- Horizontal lines & "مسار" text in Arabic -->
  <line x1="50" y1="44" x2="65" y2="44" stroke="#1B6A58" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="48" font-family="'Cairo', sans-serif" font-weight="800" font-size="14" fill="#3B82F6">مسار</text>
  <line x1="102" y1="44" x2="117" y2="44" stroke="#1B6A58" stroke-width="2" stroke-linecap="round"/>
</svg>
